name: CI/CD Flight Service Pipeline
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs this to view the commit history.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Executes Build, Test Pyramid, and Sonar Analysis in a single efficient command.
      # ---  Test Pyramid step ---
      - name: Build, Test and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  package-and-push:
    needs: build-and-analyze # Failure Handling
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          mvn package -DskipTests
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flight-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/flight-service:latest